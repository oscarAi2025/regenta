<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a43">
<title>Sin conexión · Regenta</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9efed; color: #102a43; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.6rem; margin: 1rem 0 .5rem; }
  p { margin: 0 0 1.5rem; color: #55676f; }
  button { font: inherit; font-weight: 700; height: 3rem; padding: 0 1.5rem; border: 0; border-radius: .75rem; background: #0b7a55; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="">
  <h1>No hay conexión a internet</h1>
  <p>Regenta necesita internet para facturar ante la DIAN y guardar tus ventas. Revisa el wifi o los datos del celular y vuelve a intentarlo.</p>
  <button onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
